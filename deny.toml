# Used by the security_audit CI job: `cargo deny check advisories`.

[advisories]
version = 2
unmaintained = "none"
ignore = [
    # astral-tokio-tar < 0.6: fix requires testcontainers >= 0.27.2
    # (API-breaking dev-dependency upgrade).
    "RUSTSEC-2026-0066",
    "RUSTSEC-2026-0112",
    "RUSTSEC-2026-0113",
    "RUSTSEC-2026-0145",
    # quick-xml < 0.41: pinned by object_store 0.12.
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",
]
